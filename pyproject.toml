[project]
name = "lic-recessive-variant-explorer"
version = "0.1.0"
description = "Local analysis pipeline for the Recessive Variant Explorer (independent portfolio project)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=0.20",
    "pandas>=2.1",
    "duckdb>=0.10",
    "pyarrow>=14",
    "bed-reader>=1.0.2",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "pytest>=8",
    "ruff>=0.4",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["pipeline/tests"]
addopts = "-q"
